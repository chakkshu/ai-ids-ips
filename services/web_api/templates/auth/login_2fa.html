<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Verification - AI-IDS/IPS Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/soc-theme.css') }}">
</head>
<body style="display: block;">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="font-size: 36px;">🔐</div>
                <h1>Two-Factor Verification</h1>
                <p>Enter the 6-digit code from your authenticator app</p>
            </div>

            <div class="flash-container">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="flash-alert {{ category }}">
                                <span>{{ message }}</span>
                                <button class="flash-close">&times;</button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>

            <form method="POST" action="{{ url_for('auth.login_2fa') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-group">
                    <label class="form-label" for="code" style="text-align: center;">6-Digit Security Token</label>
                    <input type="text" id="code" name="code" class="form-control code-input" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="one-time-code" placeholder="000000">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                    Verify & Access Console
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="{{ url_for('auth.logout') }}" style="color: var(--text-muted); font-size: 12px; text-decoration: none;">
                    &larr; Cancel and Sign Out
                </a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
