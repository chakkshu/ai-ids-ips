{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-container" role="status" aria-live="polite">
            {% for category, message in messages %}
                <div class="flash-alert {{ category }}">
                    <span>{{ message }}</span>
                    <button type="button" class="flash-close" aria-label="Dismiss message" data-dismiss-flash>&times;</button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
