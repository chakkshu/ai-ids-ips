name: AI-IDS-IPS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-security:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Code Formatting (Black)
        run: black --check .

      - name: Lint Codebase (Ruff)
        run: ruff check .

      - name: Static Type Analysis (mypy)
        run: mypy core services run.py

      - name: Static Security Analysis (Bandit SAST)
        run: bandit -r core ml services prevention capture utils -ll

  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_ids_ips_test
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Alembic Migrations (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://test_admin:test_password@localhost:5432/ai_ids_ips_test
          APP_MASTER_KEK: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUDIT_HMAC_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+psycopg2://test_admin:test_password@localhost:5432/ai_ids_ips_test
          AI_IDS_TEST_DATABASE_URL: postgresql+psycopg2://test_admin:test_password@localhost:5432/ai_ids_ips_test
          REDIS_URL: redis://localhost:6379/0
          RATELIMIT_STORAGE_URI: memory://
          APP_MASTER_KEK: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUDIT_HMAC_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          ARGON2_TIME_COST: "1"
          ARGON2_MEMORY_COST: "8192"
          ARGON2_PARALLELISM: "1"
        run: |
          pytest --cov=core --cov=ml --cov=services --cov=prevention --cov=capture --cov=utils --cov-report=xml tests/

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
