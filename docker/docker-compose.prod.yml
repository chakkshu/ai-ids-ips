version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ids_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web-api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - ids_net

  db:
    image: postgres:16-alpine
    container_name: ids_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - ids_net

  redis:
    image: redis:7-alpine
    container_name: ids_redis_prod
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - ids_net

  web-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ids_web_api_prod
    restart: always
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - APP_ENV=production
      - APP_DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - ids_net

  detection-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: ids_detection_engine_prod
    restart: always
    command: ["python", "run.py", "detection-engine"]
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - ids_net

  prevention-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: ids_prevention_engine_prod
    restart: always
    command: ["python", "run.py", "prevention-engine"]
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - ids_net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: ids_celery_worker_prod
    restart: always
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - ids_net

volumes:
  pg_data_prod:
  redis_data_prod:

networks:
  ids_net:
    driver: bridge
