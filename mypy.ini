[mypy]
python_version = 3.11
# Third-party packages such as Flask-Login, Flask-SocketIO, qrcode, and Celery
# do not ship PEP 561 type information. Their runtime behaviour is exercised by
# the test suite; mypy still checks all first-party modules.
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
show_error_codes = True
